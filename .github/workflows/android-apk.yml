name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: https://edugard-aipowerd.onrender.com

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::error::FIREBASE_GOOGLE_SERVICES_JSON is required; refusing to publish an APK with push disabled."
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../EduGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EduGuard-Android
          path: EduGuard.apk

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "android-${GITHUB_RUN_NUMBER}"
          EduGuard.apk
          --repo "$GITHUB_REPOSITORY"
          --title "EduGuard Android Build ${GITHUB_RUN_NUMBER}"
          --notes "Installable Android testing build generated from main."
          --latest
