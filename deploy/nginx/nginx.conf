load_module modules/ngx_http_brotli_filter_module.so;

events { worker_connections 2048; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/event-stream image/svg+xml;
    brotli on;
    brotli_comp_level 5;
    brotli_types application/json application/javascript text/css text/plain text/event-stream image/svg+xml;

    upstream eduguard_api {
        least_conn;
        server api:5000;
        # Add api-2:5000, api-3:5000 here when replicas exist.
    }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.eduguard.example;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;

        location /eduguardHub {
            proxy_pass http://eduguard_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        location /reports/ {
            proxy_pass http://eduguard_api;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location / {
            proxy_pass http://eduguard_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
